plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// local.properties 에서 카카오 키 로드(공개 저장소에 키를 넣지 않기 위함)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) { localPropsFile.withInputStream { localProps.load(it) } }
def kakaoNativeKey = localProps.getProperty('KAKAO_NATIVE_KEY', '')
def kakaoRestKey = localProps.getProperty('KAKAO_REST_KEY', '')

android {
    namespace 'com.carmode.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.carmode.launcher"
        minSdk 29              // Android 10+ (S20는 Android 13이므로 충분)
        targetSdk 34
        versionCode 13
        versionName "1.12"

        buildConfigField "String", "KAKAO_NATIVE_KEY", "\"${kakaoNativeKey}\""
        buildConfigField "String", "KAKAO_REST_KEY", "\"${kakaoRestKey}\""
    }

    signingConfigs {
        release {
            storeFile file('../carmode-release.jks')
            storePassword 'carmode2026'
            keyAlias 'carmode'
            keyPassword 'carmode2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'

    // 네트워크 (날씨/대기질 API)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 위치 (GPS)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Kotlin 코루틴 (비동기 네트워크)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Shizuku — 루팅 없이 adb(shell) 권한으로 가상 디스플레이에 지도앱 실행/터치 주입
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // 카카오맵 SDK (테마2 지도 카드 렌더링)
    implementation 'com.kakao.maps.open:android:2.15.2'
}
